{
    "services" : [
        {
            "name" : "ohssh",
            "path" : ["/system/bin/sh", "/data/oh-ssh/boot-start.sh"],
            "uid" : "root",
            "gid" : ["root", "shell", "log", "readproc", "file_manager"],
            "sandbox" : 0,
            "start-mode" : "boot",
            "secon" : "u:r:su:s0"
        }
    ],
    "jobs" : [
        {
            "name" : "ohssh-on-boot-completed",
            "condition" : "bootevent.boot.completed=true",
            "cmds" : ["start ohssh"]
        }
    ]
}
