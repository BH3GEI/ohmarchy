# /etc/modprobe.d/ohmarchy-edid.conf: 鸿融's virtio-gpu gets the 120 Hz EDID.
# virtio-gpu reads the EDID once, when it binds; a debugfs edid_override written
# later (the old ohmarchy-edid.service) never reached the mode list, so the
# EDID has to be in place before the module loads. drm.edid_firmware on the
# kernel command line also reached route B's vmwgfx (connector Virtual-1 too);
# this hook only runs when virtio_gpu loads, which route B never does. The
# module loads from the initramfs, so this file and the EDID go in there
# (modconf hook; FILES in mkinitcpio.conf.d/zz-ohmarchy-edid.conf). Verified
# 2026-10-27 in 鸿融: 2160x1440@119.98, "OMA Omarchy 120".
install virtio_gpu /usr/bin/modprobe drm; echo Virtual-1:edid/omarchy-120.bin > /sys/module/drm/parameters/edid_firmware; /usr/bin/modprobe --ignore-install virtio_gpu $CMDLINE_OPTS
