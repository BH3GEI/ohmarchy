{
    "services": [
        {
            "name": "ohmarchy-desktop",
            "path": [
                "/system/bin/sh",
                "/data/local/archtest/boot-start.sh"
            ],
            "uid": "root",
            "gid": [
                "root",
                "shell",
                "log",
                "readproc"
            ],
            "sandbox": 0,
            "start-mode": "boot",
            "once": 1,
            "secon": "u:r:su:s0"
        }
    ]
}
