# Route D's sound output (installed as ~/.config/pipewire/pipewire.conf.d/ohmarchy-audio.conf).
# The session has no sound hardware: everything plays into the sink "HarmonyOS",
# and protocol-simple streams that sink's monitor as raw PCM (S16LE, 48 kHz,
# stereo) to the display app on 127.0.0.1:4714, which plays it with OHAudio
# (native/app/entry/src/main/cpp/audio.cpp).
context.objects = [
    { factory = adapter
      args = {
          factory.name           = support.null-audio-sink
          node.name              = "ohmarchy-out"
          node.description       = "HarmonyOS"
          media.class            = Audio/Sink
          audio.rate             = 48000
          audio.position         = [ FL FR ]
          monitor.channel-volumes = true
          priority.session       = 2000
          object.linger          = true
      }
    }
]
context.modules = [
    { name = libpipewire-module-protocol-simple
      args = {
          capture        = true
          playback       = false
          audio.rate     = 48000
          audio.format   = S16LE
          audio.channels = 2
          audio.position = [ FL FR ]
          server.address = [ "tcp:127.0.0.1:4714" ]
          capture.props = {
              target.object      = "ohmarchy-out"
              stream.capture.sink = true
              node.latency       = 240/48000
          }
      }
    }
]
