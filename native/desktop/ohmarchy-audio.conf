# Route D's sound output (installed as ~/.config/pipewire/pipewire.conf.d/ohmarchy-audio.conf).
# The session has no sound hardware: everything plays into the sink "HarmonyOS";
# ohmarchy-audio-relay streams that sink's monitor to the display app over the
# abstract socket @ohmarchy-audio (only to the app's uid), which plays it with
# OHAudio (native/app/entry/src/main/cpp/audio.cpp). No TCP port: the session
# shares the host's network, where any process could connect to one.
context.objects = [
    { factory = adapter
      args = {
          factory.name           = support.null-audio-sink
          node.name              = "ohmarchy-out"
          node.description       = "HarmonyOS"
          media.class            = Audio/Sink
          audio.rate             = 48000
          audio.position         = [ FL FR ]
          monitor.channel-volumes = true
          priority.session       = 2000
          object.linger          = true
      }
    }
]
