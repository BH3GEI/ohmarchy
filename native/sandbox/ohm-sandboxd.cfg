{
    "services": [
        {
            "name": "ohm-sandboxd",
            "path": ["/system/bin/sh", "/data/local/ohm-sandbox/bin/boot-serve.sh"],
            "uid": "root",
            "gid": ["root", "shell", "log", "readproc"],
            "sandbox": 0,
            "start-mode": "boot",
            "once": 1,
            "secon": "u:r:su:s0"
        }
    ]
}
