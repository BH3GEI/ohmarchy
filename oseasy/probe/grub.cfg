# Oseasy VM boot probe. Every entry: console on the EFI framebuffer and on the
# serial port (StratoVirt logs it), the HMV ID-register quirk, a telnet root
# shell on 172.16.100.2:5000. The vmwgfx entries load the module and run
# modetest; see oseasy/probe/init.
set timeout=5
set default=0
set base="console=tty0 console=ttyAMA0,115200 earlycon=pl011,mmio32,0x09000000 arm64.hmv_idreg_quirk loglevel=7"
set vmw="vmwgfx.hvm_mmio=1 vmwgfx.hvm_display=2 vmwgfx.msg_enabled=0"

# Default (root-on-image): boot Omarchy from an ext4 image on Oseasy's shared folder
# (virtiofs, tag shared_dir = HarmonyOS 文件管理器/Documents). /dev/vda is unused, so
# Oseasy's 再次安装 never wipes the system and state persists. init mounts the share,
# loop-mounts /shared/ohmarchy/omarchy-root.img, grows+fscks it, and switch_roots in;
# the image's own first-boot service then sets the password and installs Omarchy.
menuentry "boot Omarchy from the shared-folder image (root-on-image)" --id orootimg {
    linux /Image $base probe.rootimg=1
    initrd /initramfs.img
}
# Install-to-vda path (kept as a fallback / for generating a disk image). If /dev/vda already holds an Omarchy we installed
# (a marker on its ext4 root), boot it directly from disk; otherwise install.
# NOTE: Oseasy's 再次安装 wipes /dev/vda before booting this ISO, so that path
# always reinstalls. What this entry buys us is the post-install step: the probe
# writes the marker then reboots, this ISO boots again, finds the marker, and
# boots the freshly installed disk — so one 再次安装 tap ends at the desktop with
# no host push and no manual steps. (init writes the marker and reboots; see
# oseasy/probe/init.) A true no-wipe "power on" is not offered by Oseasy for a
# Linux guest (it never gets the Windows guest-agent install-complete signal).
menuentry "boot installed Omarchy on vda, else install from host" --id osmart {
    insmod part_gpt
    insmod ext2
    insmod search_fs_file
    insmod search_fs_uuid
    insmod configfile
    if search --no-floppy --file --set=root /boot/ohmarchy-oseasy-installed ; then
        echo "found an installed Omarchy on ($root); booting it from disk"
        configfile ($root)/boot/grub/grub.cfg
    else
        echo "no installed Omarchy on vda; entering install mode"
        search --no-floppy --file --set=root /oseasy-probe
        linux ($root)/Image $base probe.install=1
        initrd ($root)/initramfs.img
    fi
}
menuentry "probe: EFI framebuffer only" {
    linux /Image $base probe.vmwgfx=0
    initrd /initramfs.img
}
menuentry "probe: vmwgfx, surface-backed dumb buffers, 120 Hz modes" {
    linux /Image $base probe.vmwgfx=1 $vmw vmwgfx.hvm_refresh=120
    initrd /initramfs.img
}
menuentry "probe: vmwgfx, BO-backed dumb buffers (GMRFB blits), 120 Hz modes" {
    linux /Image $base probe.vmwgfx=1 $vmw vmwgfx.hvm_refresh=120 vmwgfx.hvm_dumb_bo=1
    initrd /initramfs.img
}
menuentry "probe: vmwgfx with HVM trace, 60 Hz" {
    linux /Image $base probe.vmwgfx=1 $vmw vmwgfx.hvm_trace=1 drm.debug=0x106
    initrd /initramfs.img
}
menuentry "probe: install a disk image from the host (tcp 5003), add vmwgfx-oseasy" {
    linux /Image $base probe.install=1
    initrd /initramfs.img
}
