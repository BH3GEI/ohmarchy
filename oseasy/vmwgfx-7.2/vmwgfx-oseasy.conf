# HarmonyOS SVGA device (svga-pci in StratoVirt, used by Oseasy and 铠大师).
#   hvm_mmio=1     registers through the 16-byte MMIO BAR0 (index at +0, value at +4)
#   hvm_display=2  screen objects (the host rejects screen targets and legacy mode)
#   msg_enabled=0  no VMware backdoor RPC (traps on the HarmonyOS hypervisor)
#   hvm_refresh    refresh rate of the reported modes; the host panel does up to 120 Hz
#   hvm_vblank=1   timer vblank at that rate, so compositors get paced page flips
options vmwgfx hvm_mmio=1 hvm_display=2 msg_enabled=0 hvm_refresh=120 hvm_vblank=1
