set timeout=30
insmod gzio
insmod part_gpt
insmod fat
# Default: boot the installed disk if its ESP has Omarchy's GRUB, otherwise
# write one from the network.
set default=1
for d in (hd*,gpt1); do
    if [ -e $d/EFI/BOOT/BOOTAA64.EFI ]; then set default=0; set esp=$d; fi
done
menuentry 'Boot the installed Omarchy disk' {
    # Omarchy's own GRUB on the virtio disk (removable path).
    chainloader $esp/EFI/BOOT/BOOTAA64.EFI
}
menuentry 'Write Omarchy disk from the network (172.16.100.3:9000)' {
    linux    /k72/Image rdinit=/write-disk.sh arm64.hmv_idreg_quirk console=tty0 console=ttyAMA0,115200 loglevel=6
    initrd   /initrd.gz /installer.cpio.gz
}
menuentry 'Write from the network, 7.2.12 with pci=nomsi (INTx)' {
    linux    /k72/Image rdinit=/write-disk.sh arm64.hmv_idreg_quirk pci=nomsi console=tty0 console=ttyAMA0,115200 loglevel=7
    initrd   /initrd.gz /installer.cpio.gz
}
menuentry 'Write from the network, Debian 6.1 kernel' {
    linux    /linux rdinit=/write-disk.sh console=tty0 console=ttyAMA0,115200 loglevel=7 ---
    initrd   /initrd.gz /installer.cpio.gz
}
menuentry 'Probe with linux-aarch64 7.2.12 + arm64.hmv_idreg_quirk' {
    linux    /k72/Image rdinit=/probe.sh arm64.hmv_idreg_quirk console=tty0 console=ttyAMA0,115200 earlycon loglevel=7
    initrd   /initrd.gz /installer.cpio.gz
}
menuentry 'UEFI firmware settings' {
    fwsetup
}
