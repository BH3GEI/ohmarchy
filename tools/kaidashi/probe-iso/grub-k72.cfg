set timeout=5
set default=0
insmod gzio
menuentry 'linux-aarch64 7.2.12 + arm64.hmv_idreg_quirk (probe)' {
    linux    /k72/Image rdinit=/probe.sh arm64.hmv_idreg_quirk console=tty0 console=ttyAMA0,115200 earlycon loglevel=7
    initrd   /initrd.gz /probe.cpio.gz
}
menuentry 'linux-aarch64 7.2.12 without the quirk (expected to hang)' {
    linux    /k72/Image rdinit=/probe.sh console=tty0 console=ttyAMA0,115200 earlycon loglevel=7
    initrd   /initrd.gz /probe.cpio.gz
}
menuentry 'Debian 6.1 (probe)' {
    linux    /linux rdinit=/probe.sh console=tty0 console=ttyAMA0,115200 earlycon loglevel=7 ---
    initrd   /initrd.gz /probe.cpio.gz
}
menuentry 'UEFI firmware settings' {
    fwsetup
}
