set timeout=5
set default=0
insmod gzio
menuentry 'ohmarchy probe (serial + tty0)' {
    linux    /linux rdinit=/probe.sh console=tty0 console=ttyAMA0,115200 earlycon loglevel=7 ---
    initrd   /initrd.gz /probe.cpio.gz
}
menuentry 'Debian installer (rescue)' {
    linux    /linux rescue/enable=true console=tty0 ---
    initrd   /initrd.gz
}
menuentry 'UEFI firmware settings' {
    fwsetup
}
