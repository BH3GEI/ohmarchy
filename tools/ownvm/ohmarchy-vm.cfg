{
    "services" : [
        {
            "name" : "ohmarchy-vm",
            "path" : ["/system/bin/sh", "/data/local/kaidashi/bin/ohmarchy-vm-boot.sh"],
            "uid" : "root",
            "gid" : ["root", "shell", "log", "readproc"],
            "sandbox" : 0,
            "start-mode" : "condition",
            "once" : 1,
            "secon" : "u:r:su:s0"
        }
    ],
    "jobs" : [
        {
            "name" : "ohmarchy-vm-on-boot-completed",
            "condition" : "bootevent.boot.completed=true",
            "cmds" : ["start ohmarchy-vm"]
        }
    ]
}
