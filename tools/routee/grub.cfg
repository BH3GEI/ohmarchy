# Omarchy in RAM (route E). Loaded by OmarchyRAM.efi from this directory.
# Kernel and initrd are read into memory here, before ExitBootServices; after
# that Linux needs no storage at all.
set timeout=10
set default=0
set d=/Omarchy-arm64

menuentry "Omarchy (in RAM)" {
    echo "loading kernel and the whole system into memory (about 2 GB, takes a while)..."
    linux $d/Image console=tty0 earlycon=efifb loglevel=4 rdinit=/init
    initrd $d/dev.cpio $d/omarchy-root.cpio.zst
}
menuentry "Omarchy (in RAM, debug: earlycon, loglevel=7, full dmesg)" {
    echo "loading kernel and the whole system into memory (about 2 GB, takes a while)..."
    linux $d/Image console=tty0 earlycon=efifb loglevel=7 ignore_loglevel rdinit=/init ohm.debug
    initrd $d/dev.cpio $d/omarchy-root.cpio.zst
}
menuentry "Omarchy (in RAM, debug, efi=noruntime)" {
    linux $d/Image console=tty0 earlycon=efifb loglevel=7 ignore_loglevel efi=noruntime rdinit=/init ohm.debug
    initrd $d/dev.cpio $d/omarchy-root.cpio.zst
}
menuentry "Omarchy test: hello" {
    echo "Hello from the Omarchy USB stick: GRUB arm64 runs on this machine."
    echo "Press any key to go back to the menu."
    read key
}
menuentry "UEFI firmware setup" {
    fwsetup
}
menuentry "Reboot" {
    reboot
}
menuentry "Back to firmware boot menu" {
    exit
}
